Comment: A state machine that tags infrastructure CloudFormation cannot reach.
StartAt: For each account
States:
  For each account:
    Type: Map
    ItemsPath: $.AccountIds
    Parameters:
      AccountId.$: $$.Map.Item.Value
    MaxConcurrency: 1
    Iterator:
      StartAt: Tag EventRules
      States:
      
        Tag EventRules:
          Type: Task
          Resource: '${TagEventRulesFunctionArn}'
          ResultPath: null
          Retry:
            - ErrorEquals:
                - States.TaskFailed
              IntervalSeconds: 2
              MaxAttempts: 5
              BackoffRate: 1.25
          Next: Tag Alarms
      
        Tag Alarms:
          Type: Task
          Resource: '${TagAlarmsFunctionArn}'
          ResultPath: null
          Retry:
            - ErrorEquals:
                - States.TaskFailed
              IntervalSeconds: 2
              MaxAttempts: 5
              BackoffRate: 1.25
          End: true
    End: true
